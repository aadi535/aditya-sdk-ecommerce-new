<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apex | The Tech Edit</title>
<meta name="description" content="Explore Apex, a demo storefront for laptops, phones, audio and more. Browse the catalog and try a sample order without payment.">



</head>

<body id="top">
 <header class="topbar">

  <div class="nav-left">

    <button id="home-btn">Shop</button>

    <button id="admin-btn" class="hidden">Admin Panel</button>

    <button id="auth-btn">Login</button>

  </div>


  <a class="brand" href="#top" aria-label="Apex storefront">APEX<span>.</span></a>


  <div class="nav-right">

    <button id="orders-btn" class="hidden">My Orders</button>


    <div class="cart-wrapper">

      <button type="button" class="cart-button" id="open-cart" aria-label="Open shopping bag">
        Bag (<span id="cart-count">0</span>)
      </button>


      <div class="cart-popup" id="cart-popup">

        <div id="cart-items"></div>

        <div class="cart-footer">

          <div>Subtotal <strong>€<span id="cart-total">0</span></strong></div>

          <button class="checkout-btn">Place Order</button>

        </div>

      </div>

    </div>

  </div>

</header>

<div class="auth-modal" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">

  <form class="auth-box" id="auth-form">
    <button id="close-auth" type="button" class="close-dialog" aria-label="Close login">×</button>

    <p id="auth-error" class="auth-error"></p>

    <h2 id="auth-title">Login</h2>

    <label for="email">Email</label><input type="email" id="email" placeholder="Email" required autocomplete="email">

    <label for="password">Password (at least 8 characters to register)</label><input type="password" id="password" placeholder="Password" required maxlength="128" autocomplete="current-password">

    <button id="submit-auth" type="submit">Submit</button>

    <button type="button" id="toggle-auth">Create an account</button>

  </form>

 </div>
<main>
  <section class="store-intro" aria-labelledby="store-title">
    <div class="hero-copy">
      <p class="eyebrow">THE TECH EDIT</p>
      <h1 id="store-title">Good tech.<br>Every day.</h1>
      <p>Explore laptops, phones, audio and more in the Apex demo store.</p>
      <a class="hero-link" href="#catalog">Explore the catalog <span aria-hidden="true">↘</span></a>
    </div>
    <img class="hero-image" src="/images/macbook.jpg" alt="" width="2048" height="1152" fetchpriority="high">
  </section>

  <section id="catalog" class="catalog-section" aria-label="Catalog and orders">
    <div id="catalog-tools" class="catalog-toolbar">
      <div><p class="eyebrow">APEX COLLECTION</p><h2>Shop the catalog</h2><p id="catalog-count" role="status"></p></div>
      <div class="catalog-controls">
        <label>Search products<input id="product-search" type="search" placeholder="Search by name"></label>
        <label>Sort by<select id="product-sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></label>
      </div>
    </div>
    <div id="products" class="products-grid"></div>
  </section>
</main>

<footer class="store-footer">
  <div><strong>Apex</strong><p>Demo store by Aditya Raj. Orders are saved for testing; no payment or delivery.</p><p id="account-status" role="status"></p></div>
  <a href="https://github.com/aadi535/aditya-sdk-ecommerce-new" target="_blank" rel="noopener noreferrer">View source ↗</a>
</footer>

<div id="product-modal" class="product-modal" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">

  <div class="product-modal-content">

    <button id="close-product" class="close-product" aria-label="Close product details">Close</button>

    <img id="product-modal-img" alt="Product Image">

    <h2 id="product-modal-title"></h2>

    <p id="product-modal-desc"></p>

    <p class="product-modal-price">
      €<span id="product-modal-price"></span>
    </p>

  </div>

</div>

<div id="toast" class="toast hidden" role="status"></div>
 <script type="module" src="/src/main.js"></script>
</body>
</html>
